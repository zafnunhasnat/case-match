name: Backend Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/casematch_test
      APP_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/casematch_test
      REVIEWER_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/casematch_test
      JWT_SECRET_KEY: synthetic-ci-secret-key-at-least-32-characters-long

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install spaCy English model
        run: python -m spacy download en_core_web_sm

      - name: Run backend tests
        run: python -m pytest tests -v
